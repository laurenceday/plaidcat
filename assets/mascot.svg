<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" width="400" height="430">
  <!-- Wildcat mascot: angular paper-fold cat head, front view -->
  <g stroke="#141414" stroke-width="3" stroke-linejoin="miter">
    <!-- left ear -->
    <polygon points="128,142 96,12 196,110" fill="#F2F2F0"/>
    <polygon points="128,142 196,110 168,138" fill="#D8D8DA"/>
    <!-- right ear -->
    <polygon points="272,142 304,12 204,110" fill="#E9E9E8"/>
    <polygon points="272,142 204,110 232,138" fill="#CFCFD2"/>
    <!-- head: faceted diamond -->
    <polygon points="128,142 272,142 330,214 256,318 200,360 144,318 70,214" fill="#F2F2F0"/>
    <!-- facet shading -->
    <polygon points="70,214 144,318 200,360 200,272" fill="#E3E3E4" stroke="none"/>
    <polygon points="330,214 256,318 200,360 200,272" fill="#EDEDEC" stroke="none"/>
    <!-- fold lines -->
    <path d="M200,142 L200,272" stroke="#9A9AA2" stroke-width="1.5" fill="none"/>
    <path d="M70,214 L200,272 L330,214" stroke="#9A9AA2" stroke-width="1.5" fill="none"/>
    <path d="M144,318 L200,272 L256,318" stroke="#9A9AA2" stroke-width="1.5" fill="none"/>
  </g>
  <!-- eyes: narrow yellow, outer corner lower -->
  <g stroke="#141414" stroke-width="3">
    <polygon points="108,216 180,204 184,236 116,244" fill="#F0D24A"/>
    <polygon points="292,216 220,204 216,236 284,244" fill="#F0D24A"/>
  </g>
  <ellipse cx="152" cy="223" rx="11" ry="14" fill="#141414"/>
  <ellipse cx="248" cy="223" rx="11" ry="14" fill="#141414"/>
  <!-- brows: heavy black chevrons, bend mid-brow -->
  <polygon points="100,204 148,180 190,190 188,202 150,194 106,216" fill="#141414"/>
  <polygon points="300,204 252,180 210,190 212,202 250,194 294,216" fill="#141414"/>
  <!-- worry lines -->
  <g stroke="#B9B9BF" stroke-width="2" fill="none">
    <path d="M122,256 L148,252"/>
    <path d="M252,252 L278,256"/>
  </g>
  <!-- mouth -->
  <polygon points="188,312 214,310 210,324 192,325" fill="#6B4238" stroke="#141414" stroke-width="2"/>
</svg>
